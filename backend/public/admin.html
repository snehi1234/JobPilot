<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com" />
  <title>Hiresprint · Admin</title>
  <link rel="icon" href="icon128.png" />
  <style>
    :root { --brand: #4a3aff; --ink: #1a1a2e; --muted: #64748b; --line: #e5e7eb; --bg: #f6f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 17px; margin: 0; }
    header .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }
    .center { text-align: center; padding: 70px 20px; }
    .center p { color: var(--muted); }
    #signin { display: inline-block; margin-top: 12px; }
    .hidden { display: none !important; }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: #fff; padding: 6px 12px; }
    button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; min-width: 120px; text-align: left; }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat.active { border-color: var(--brand); box-shadow: 0 0 0 2px #e0dcff; }
    .layout { display: grid; grid-template-columns: 1fr 260px; gap: 18px; align-items: start; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    .toolbar input { flex: 1; min-width: 180px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .card .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .card .top .type { color: var(--ink); font-weight: 600; font-size: 13px; }
    .pill { margin-left: auto; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .pill.new { background: #fef3c7; color: #92400e; } .pill.in-progress { background: #dbeafe; color: #1e40af; }
    .pill.fixed { background: #dcfce7; color: #166534; } .pill.wont-fix { background: #f1f5f9; color: #475569; }
    .msg { white-space: pre-wrap; word-break: break-word; margin: 8px 0; font-size: 14px; }
    .meta { font-size: 12px; color: #475569; background: #f8fafc; border-radius: 8px; padding: 8px 10px; }
    .meta div { margin: 2px 0; }
    .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .actions button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .actions a { margin-left: auto; color: var(--brand); text-decoration: none; font-weight: 600; }
    aside .box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
    aside h3 { font-size: 13px; margin: 0 0 8px; }
    aside ol { margin: 0; padding-left: 18px; font-size: 13px; }
    aside li { margin: 3px 0; word-break: break-all; }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    .error { color: #991b1b; }
    .muted { color: var(--muted); font-size: 12px; align-self: center; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; font-weight: 600; color: var(--muted); }
    .tab.on { color: var(--brand); border-bottom-color: var(--brand); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .kpi b { display: block; font-size: 24px; }
    .kpi span { color: var(--muted); font-size: 12px; }
    .kpi small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
    .panel h3 { font-size: 14px; margin: 0 0 10px; }
    .panel .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    .chart svg { width: 100%; height: 180px; display: block; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    .bars .bar { display: grid; grid-template-columns: 130px 1fr 70px; gap: 8px; align-items: center; font-size: 13px; margin: 5px 0; }
    .bars .track { background: #eef2ff; border-radius: 6px; height: 12px; overflow: hidden; }
    .bars .fill { background: var(--brand); height: 100%; border-radius: 6px; }
    .bars .val { text-align: right; color: var(--muted); font-size: 12px; }
    table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    table.t th { color: var(--muted); font-weight: 600; font-size: 12px; }
    table.t td.n, table.t th.n { text-align: right; }
  </style>
</head>
<body>
  <header>
    <img src="icon128.png" alt="" />
    <h1>Hiresprint · Admin</h1>
    <div class="right">
      <span id="who"></span>
      <button id="refresh" class="hidden" type="button">↻ Refresh</button>
      <button id="signout" class="hidden" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <section id="gate" class="center">
      <h2>Feedback & reports</h2>
      <p>Sign in with an admin Google account to continue.</p>
      <div id="signin"></div>
      <p id="gateError" class="error"></p>
    </section>

    <section id="app" class="hidden">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" class="tab on" data-tab="feedbackView" aria-selected="true">💬 Feedback</button>
        <button type="button" role="tab" class="tab" data-tab="metricsView" aria-selected="false">📈 Metrics</button>
      </nav>
      <div id="metricsView" class="hidden">
        <div class="toolbar">
          <select id="metricsDays" aria-label="Period">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
          <span id="metricsUpdated" class="muted"></span>
        </div>
        <div id="metrics"><p class="empty">Loading metrics…</p></div>
      </div>
      <div id="feedbackView">
      <div class="stats" id="stats"></div>
      <div class="layout">
        <div>
          <div class="toolbar">
            <input id="search" type="search" placeholder="Search messages, sites, errors…" aria-label="Search" />
            <select id="typeFilter" aria-label="Type">
              <option value="">All types</option>
              <option value="bug">🐞 Bug</option>
              <option value="wrong-answer">✏️ Wrong answer</option>
              <option value="site">🌐 Site not supported</option>
              <option value="idea">💡 Idea</option>
              <option value="other">💬 Other</option>
            </select>
          </div>
          <div id="list"></div>
        </div>
        <aside>
          <div class="box"><h3>Top problem sites · last 7 days</h3><ol id="topSites"></ol></div>
          <div class="box"><h3>By version</h3><ol id="versions"></ol></div>
        </aside>
      </div>
      </div><!-- /#feedbackView -->
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="admin.js" defer></script>
  <script src="admin-metrics.js" defer></script>
</body>
</html>
