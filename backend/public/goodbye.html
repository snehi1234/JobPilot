<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'self'; connect-src 'self'" />
  <title>Hiresprint was removed</title>
  <link rel="icon" href="/icon128.png" />
  <style>
    body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1a1a2e; background: #f6f7fb; }
    main { max-width: 560px; margin: 60px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px 30px; text-align: center; }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: 22px; margin: 12px 0 4px; }
    p { color: #64748b; }
    .reasons { display: grid; gap: 8px; margin: 18px 0; }
    .reasons button { font: inherit; text-align: left; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; cursor: pointer; }
    .reasons button:hover { border-color: #4a3aff; background: #f5f3ff; }
    .thanks { display: none; color: #166534; font-weight: 600; }
    a { color: #4a3aff; }
  </style>
</head>
<body>
  <main>
    <img src="/icon128.png" alt="Hiresprint" />
    <h1>Sorry to see you go</h1>
    <p>Hiresprint has been removed. Mind telling us why? One click, completely anonymous.</p>
    <div class="reasons" id="reasons">
      <button type="button" data-reason="site">It didn't work on the job sites I use</button>
      <button type="button" data-reason="answers">The answers weren't good enough</button>
      <button type="button" data-reason="setup">Setup was too much work</button>
      <button type="button" data-reason="privacy">Privacy concerns</button>
      <button type="button" data-reason="found_job">I found a job 🎉</button>
      <button type="button" data-reason="other">Something else</button>
    </div>
    <p class="thanks" id="thanks">Thank you — this helps us make Hiresprint better.</p>
    <p>Want to tell us more? Email <a href="mailto:hiresprint.support@gmail.com">hiresprint.support@gmail.com</a>.<br />
      Changed your mind? <a href="https://chromewebstore.google.com/detail/gnohpngndnfdlbacmbmnoilgeaeljhep">Reinstall Hiresprint</a>.</p>
  </main>
  <script src="/goodbye.js"></script>
</body>
</html>
